const works=[{"id": "fish", "title": "钓鱼", "cat": "故事", "keys": ["症候", "异化", "生态寓言"], "theme": "sea", "text": ["傍晚霉红的太阳突兀地吊在海面上，胶白色的泡沫一层层在沙滩上堆积。天翳着一层若有若无的黑烟，连带着海水也折射得不太干净。渡边次郎坐在他的老渔船上，鱼竿斜插在渔船上。渡边贪婪地吮吸着海面上凝固的咸腥的气味，任由海浪裹挟着破碎的霞光把他的渔船打得摇摇晃晃。视线沿着最外层泡沫向上滑，渡边看见了熟悉的木屋。这是渡边生活了六十多年的地方，此刻托夕阳的福，房子竟亮晶晶的。渡边沿着海岸向北边继续滑动视线，很快便找到了黑烟的根源。那栋钢筋搭建而成的化肥厂此时半边处在背光的阴暗之中，剪影又黑又巨大。渡边的儿子就在那里工作。渡边厌恶地拧紧眉头，把头别向渐渐阴沉的海面。", "渡边在水俣湾钓了六十八年鱼，平生最珍视两样东西——他的老鱼竿和老猫。", "渡边的鱼竿是他年轻时就用的，那时候他是捕鱼的好手，渡边力气大，捕的鱼也大，鱼竿子得耐折。渡边把鱼竿子当成老战友。海边的风是粗糙的固体，里面的盐分多得要析出来，每天刺啦刺啦地磨着海浪、石头和渡边的小木屋，还硬生生把包括渡边在内的渔民的皮肤打磨得比老树皮还要厚实。渡边就靠着自己古铜色的肌肉和这把鱼竿，撑起了整个家。不过渡边明白，养活他们家是自己脚底下这汪蓝盈盈的大海。渡边打小在海边长大，他热爱大海，敬畏大海，他觉得自己身体里流动着的就是海水。渡边到了现在也毒瘾般地迷恋着大海这股咸湿腥辣的冲鼻的味道。这是大海的呼吸。渡边知道他和鱼竿是在向大海索取，因此即使他信任海的慷慨，依然常常怀着一颗虔诚而谦逊的心。有经验的渔民从不逆着海的性子来，渔民的命掌握在大海那边，什么时候出海、回家，他都只凭海的意愿。", "渡边的猫是一只三色猫，左脸有一块形状似鱼的黄色斑点。猫跟了渡边有十年，也是一只老猫了。渡边常常饿着肚子，也得给猫吃的。这会儿，天已经完全黑了，渡边在船头点上火把，他就又想起了老猫亮晶晶的眼睛。渡边的老伴两年前死了，儿子又常不回家，他每每想起家里还有老猫等他，渡边心里就一阵暖意。", "第二天天亮的时候，渡边拖着他的渔船回到了他的木屋。出海五天，渡边几乎没有收获。最近运气太差啦，渡边安慰老钓竿，不是你的错。老猫听见主人回家的声音，蹒跚着出来迎接他。渡边扔给老猫一条滑溜溜腻歪歪的鱼，老猫盯着渡边短促地叫了两声。渡边叹口气，你可知足吧，别嫌鱼小，也别怪老鱼竿，谁叫我年老不中用了哩。", "儿子仍然没有回来，听说儿子当了什么管理人员，工作忙，赚得多，渡边照理应该高兴。但渡边打心里反感那家化肥工厂，儿子职位越高，渡边越觉得儿子和工厂是一伙人，也就越觉得别扭。儿子总骂渡边是老顽固，谁跟钱过不去。儿子还说，渡边老了，钓不到鱼，一天瞎折腾。渡边抿着嘴，心里直骂老伴惯了个白眼狼。", "渡边听着老猫吃鱼的声音，水灵灵的，才觉得肚子饿，于是也煮了条鱼吃了。吃到一半，渡边闻到一股隐隐约约的臭味，他绕着房间找了一圈也没找到源头，低头看老猫依然吃的很香，他却没胃口了。连日钓鱼的疲惫慢慢侵入，他就睡着了。", "那天夜里，渡边被老鱼竿倒地的声音吵醒，起来一看，老钓竿一头鱼线缠在沙子里，另一头的老猫在月光下跳舞。渡边开始以为自己看错了。确实是老猫，它在沙滩上跳着一种扭曲而古老的舞蹈，似喝醉了酒的舞伎般挑逗着海浪的低鸣，身体均匀地颤抖。猫往海边扭去，渡边着魔似的在后面跟着，突然猫凄厉地叫了一声。渡边看到它脸上的鱼状斑纹在清亮流动的月光中真的化成一只鱼，在空中跃起，然后落在海里，发出噗通的声音。一个浪头打来，猫就不见了。", "这以后，渡边不敢再去海边，只能一天躺在床上。渡边总是做噩梦，梦里是几个粗大的钢铁管道，又臭又黑的液体放肆地流进海里。渡边觉得这个臭味似曾相识。他用最恶毒的词咒骂这这一排管道，但是黑色的污水源源不断的涌出。然后他梦见了一群冒着黑烟的鱼瞪大了眼睛向他游来，把他闷住，他快要窒息。顷刻，他也成了一条鱼，他环顾四周，都漂着跳舞的猫的尸体，海水也是黑色的、腥臭的。他看见老鱼竿立在那里，于是欣喜地游过去，一口咬住饵料。饵料散发着恶心的重金属味，渡边被一股大力拖起，他下巴刺痛着。飞在空中，他看见了握着鱼竿的年轻的自己。下巴痛的厉害，接着全身疼，像被腐蚀了一样疼，他开始呻吟……", "儿子闻声而来，发现渡边躺在床上，诡异地弓着身子，很像一个被大鱼压弯的钓竿。渡边嘴里含含糊糊发出急促的叫喊，儿子急忙将手放在父亲脸上抚慰他。碰到父亲粗糙而干燥的脸的时候，他愣住了。父亲的脸上满是滚烫而浑浊的泪水。", "再后来，渡边次郎死了。儿子被一些官员带走了。渡边的名字同“水俣”一起出现在了日本的各大报纸上。老猫、渡边次郎和渡边的儿子的名字都在上面。只是通篇报道都没有出现钓鱼竿，渡边次郎要是看到了又得花多少口舌安慰被漏掉的老钓鱼竿了。"], "excerpt": "那天夜里，渡边被老鱼竿倒地的声音吵醒，起来一看，老钓竿一头鱼线缠在沙子里，另一头的老猫在月光下跳舞。渡边开始以为自己看错了。确实是老猫，它在沙滩上跳着一种扭曲而古老的舞蹈，似喝醉了酒的舞伎般挑逗着海浪的低鸣，身体均匀地颤抖。猫往海边扭去，渡边着魔似的在后面跟着，突然猫凄厉地叫了一声。渡边看到它脸上的鱼状斑纹在清亮流动的月光中真的化成一只鱼，在空中跃起，然后落在海里，发出噗通的声音。一个浪头打来，猫就不见了。", "by": "谢冰妍", "primary": true, "note": "注：1956年，水俣湾附近发现了一种奇怪的病。这种病症最初出现在猫身上， 病猫步态不稳，抽搐，甚至跳海“自杀” ， 因此被称为“猫舞蹈症” 。不久之后， 当地发现了有人患有这些病症。患者口齿不清、手足麻痹、知觉出现障碍、手足变形， 神经失常，直至死亡。后来研究表明，此病症源于日本氮肥公司排放的含有大量的汞的废水，而人误食含有大量汞的海鱼后中毒。此次病症引起了日本社会乃至全世界的广泛关注，后被称为“水俣病”。"}, {"id": "home", "title": "菊儿人家：胡同深处有人家", "cat": "人物与非虚构", "keys": ["城市记忆", "烟火", "情感"], "theme": "warm", "text": ["雪后初霁的南锣鼓巷，比平日要清净不少。一场大雪似乎封住了这条北京著名商业街往日的繁忙与拥挤。巷子夹道树枝上的残雪经北风一卷便纷纷扬落在潮湿的青石板路上，叫人直打寒颤。从北往南数过去的第三个巷口，墙上锈着一块“菊儿胡同”的路牌。转进这条百米长的窄胡同，一阵热腾腾的卤香就再也藏不住，渐渐从寒冷的北风里展露出来。卤香勾人往胡同深处走去，左边是一颗枯萎在屋子里的枣树，枣树对面就隐着这烟火香味的来源——卤肉饭店“菊儿人家”。", "菊儿人家的店铺不大，满打满算也就只能招待二三十个客人。这家没有广告的小小店面显得与南锣鼓巷的商业氛围有些格格不入。我们坐在店铺靠门的位置等待老板小枣。刚毕业工作不久后，小枣从父母手里接过了这家卤肉饭店，而她现在也已年近不惑。小枣推门而入，爽朗的笑声随着冷气从门口涌进来——热情、亲切，这是她给人的第一印象。听说我们是大学生，她给我们带了一大包“大白兔”奶糖，还热情地要留我们吃饭。她似乎对这种采访非常熟悉、也十分乐此不疲。她说，“我特别喜欢这种采访，因为我有的是故事，我有很多故事……”", "一、百家饭吃出的卤肉饭", "小枣为什么叫小枣？这要从21世纪初的北京胡同讲起。彼时的南锣鼓巷还只是一条普通的北京胡同，小枣也还是胡同里肆意长大的一个小孩。黄昏时分，当家家户户飘出饭香，胡同就到了一天最热闹的时候。小枣是吃胡同里的“百家饭”长大的——邻里之间哪家做了好吃的，指定要给胡同里的所有人家端一碗；哪家人吵了架，其他家也要去帮忙劝一劝。胡同里的时间好像总是又慢又悠长，而在小枣的记忆中，夏天的午后是胡同里最悠闲的时光。当整个胡同都在午休的时候，小枣总是盯着对面李奶奶家那颗枣子树。“枣子什么时候收，能不能给我吃一点？”嘴馋的小枣总是这样问，但李奶奶从来也不理她的请求。不知道多少个午后，小枣就这样梦着满枝头红彤彤的枣子，嘴里生出枣子的甜香，而那些闷热、粘腻而漫长的时光就晃悠悠地一去不复返了。", "小枣考上大学临走那天，正是北京秋天枣子结满枝头的时候。李奶奶没有说太多的话，只是让儿子去打下了这一枝的枣子给小枣。她说，这一茬枣子就是给小枣留的。小枣说，那一茬枣子格外好吃、格外甜，她一直记着那一茬枣子，于是给自己在社交平台上的名字都取做“菊儿小枣”。胡同里的人情味就像这枣子树一样，毫不吝啬地将所有的香味给予胡同里的每一个人。", "胡同文化浸泡着小枣一家，他们的小店在胡同文化里生根发芽。菊儿人家就是从胡同的百家饭里“吃出来”的。小枣大学毕业后，和其他青春期的女孩一样沉迷减肥。小枣的妈妈也和所有青春期女孩的妈妈一样，担心小枣吃不饱，想着法子要让小枣多吃些。那时台湾的卤肉饭刚刚传进北京，小枣的母亲改良出少油少盐的卤肉饭给小枣吃——又健康又美味的食谱让小枣赞不绝口。按照胡同里的习惯，母亲顺带将自己做的卤肉饭给每家都端了一碗。改良版卤肉饭意外地受到了大家的热烈欢迎，小枣的同学们也经常来捧场。正值小枣父母从国企下岗“自谋职业”，在邻里们的不断鼓励与支持下， 他们心中“开一家饭店”的想法越来越强烈，最终成为了现实。", "“菊儿”在北京话里的谐音是水井的意思，有水井的地方就有人。但当人都走完了，菊儿胡同还剩下什么呢？菊儿人家已经从一个偶然的想法变成了小枣一家红火的饭店生意，但那些曾经见证了它诞生的邻居们却一户户陆续搬走了。在这方鱼骨状的窄窄的胡同里，胡同的温度似乎在一点点褪去；那些在胡同里吃百家饭长大的孩子也已然成人，从胡同搬走，住进了有独立抽油烟机的高楼大厦；那些曾经给小枣端过自己家做的排骨、打过自己家枣的老人们，则大多没能挺过疫情肆虐的冬天。", "然而，那些嗅觉灵敏的人们仍然能顺着一股香气就找到胡同里的某个角落——就像菊儿人家这样的地方。胡同直到如今还承担着一代北京人对于集体地域空间的温柔想象和怀旧情绪。小枣对卤肉饭店注入的情感，则是她对于胡同独有的温情与执着——胡同承担了她对这片土地、对故乡的热爱。这份热爱贯穿着她的整个生命。", "二、续一碗对生活的温情", "小枣至今还记得菊儿人家开张第一天的样子——他们一家人在店里等到了傍晚八点才迎来了第一个客人。如获至宝的小枣一家一拥而上，围着唯一一个客人追问个不停。客人被四个人团团围住，吓得头也不敢抬，只得趁着老板回厨房的间隙落荒而逃，留下慌张又懊恼的小枣一家。没想到一星期后，这位腼腆的客人竟又回来了——还带着一面包车的人。他指着菊儿人家的店铺说，这家卤肉饭特别好吃，老板一家也特别有意思。菊儿人家就在这样的口口相传中吸引了无数居住在胡同里的食客、曾经居住在胡同里的食客和向往胡同的食客。", "对于小枣一家来说，经营菊儿人家从来都不是一件容易的事情。饭店的生意做起来了，却又碰上了北京胡同的拆改。菊儿人家本就开在胡同的自家房屋里，如果房子被拆了，菊儿人家又该开在哪里呢？不仅如此，对于从十八岁就生活在胡同里的母亲，拆自家房子更是堪比拆掉自己心头的一块肉。小枣的母亲心急如焚，但在她看来，不能因为自己做买卖，就影响胡同拆改，影响大家过更好的生活。最终，小枣的母亲主动请缨，含泪拆掉了自家房屋的二层，将菊儿人家保留在胡同内，自己则搬出生活了一辈子的地方，在外租房住。为了积极动员胡同里的街坊邻居，小枣母亲还成立了宣讲团。", "一边面临拆改，一边经营饭店，小枣父母在年龄渐长中感到力不从心。小枣毕业后本在国企有着一份踏实稳定的工作，但她心疼父母的辛劳。", "“我应该让父母有一个靠山。我不应该让他们觉得家里没有人了，饭店开不下去了，毕竟我们还有那么多的客人啊”。", "于是她不顾父母的反对，毅然辞去国企的工作，怀揣着单纯的热爱接手了菊儿人家的经营。然而对于刚毕业、只在国企工作过的小枣来说，独自管理一家饭店的担子太沉太重，忙里忙外的她几乎崩溃。此时，小枣的丈夫在北京一家外企有着高薪体面的工作，事业蒸蒸日上。看见小枣的崩溃，他也决心辞去他的工作，与小枣一起投入饭店的经营。", "“我们有那么多的客人，老有客人跟我们说让我们一定要做下去。如果我们不做了，那些客人回来胡同都没有地方去了，我不能让我的客人们伤心”，小枣这样说。小枣一家就是抱着这样朴素的想法，即使自己搬出去，也要把菊儿人家留在胡同里。菊儿人家这家店，竟成了往日生活最后的记录者、成了一条纽带。它见证着、又经历着——向内，是一个小庭的传承与延续；向外，是一个大家的凝聚与变迁。", "菊儿人家紧邻中央戏剧学院南锣鼓巷校区。刚开业时，南锣鼓巷还是酒吧一条街的美食荒漠，吃腻了食堂的中戏学生想找地方改善伙食也无处可去。好不容易找到这家好吃的卤肉饭，菊儿人家就成了中戏孩子们的聚集地。但每到月底，因花光生活费而囊中羞涩，又因长身体而饭量不小的大学生们，常常涨红着脸请小枣的母亲给他们免费添点饭。小枣的母亲在学生们身上看见了小枣的影子，她觉得，卤肉饭没有肉怎么吃得下饭呢？于是在饭店里定下了“免费续肉续饭”的规矩。中戏的学生们毕业了一批却一批，而这条规矩却一直被小枣保留到了今天。", "或许是因为紧邻中戏的缘故，许多名人都在菊儿人家吃过饭：金龟子、刘和刚、蓝盈莹……但在菊儿人家，一碗饭里饱含的从来就是无关身份的情感传递。续饭，延续的是从学生时代走向更广阔的人生；烟火气里，无论是明星还是普通人，只要来吃饭的就是顾客。在小枣心中，每一个来饭店吃饭的客人都像家人一样亲切与珍贵。讲起自己和客人的故事，小枣的嘴角总是洋溢着骄傲又幸福的微笑。而她的店里则挂满了她与客人的合影、客人送她的东西——“菊儿人家”的牌匾、装饰用的字画、细细装裱的照片……小枣骄傲地说，那些来自己饭店吃饭的客人喜欢这里，不是因为他们曾经住在这里，而是因为他们喜欢胡同所代表的情谊。总有人热爱着胡同，热爱着胡同里的人情味和善良，小枣希望自己能做这份善良的守护者。", "夜深的时候，小枣偶尔也会梦见自己的大学时光，她的丈夫则总是梦见自己在外企工作的日子，这深埋在梦境里的日子或许是夫妻俩最无忧无虑的时光。但小枣从未后悔自己的选择。用“我愿意”和“我乐意”的逻辑去取代现代性思维中的“平等交换”，换来的是小枣身上的坚定与自得。看起来仅凭着一腔热爱横冲直撞的小枣，身上却看不出一点现代城市人常有的迷茫。", "酸甜苦辣是一顿上好的饭菜必不可少的味道，也是生活无法缺少的滋味。或许比起精打细算的工业味精配比，又苦又甜的日子才是生活恰到好处的滋味。", "、向前看，别迷路", "小枣并不是没有担心过她的店会随着胡同的消逝而消亡。但令小枣感动的是，每当自己的饭店经营遇到困难的时候，客人们总是能给她鼓励。最艰难的时候，每天关门时小枣甚至不知道一觉醒来菊儿人家是否还能继续开张。她也想过放弃开店，改做外卖。是她的老顾客给了她坚持下去的勇气。许多菊儿人家的老顾客纷纷对小枣说，你一定要把这个饭店做下去，不然我们以后在胡同里落脚的地方都没有。小枣心想，在门店里吃上一口热乎乎的卤肉饭，才叫是“人家”。人与人的温情让胡同在物理坍缩的同时成为了一首能被讲述、被传播的诗。", "于是，她也开始主动聆听客人们的故事。她认识了一个16岁只身来到北京的女孩。女孩生活窘迫，却将住在胡同里的小房间布置的如城堡一般；患有抑郁症，却能看见小枣眼里看不见的北京的美好。女孩告诉小枣，她特别喜欢在菊儿人家点一份自己喜欢吃的饭，就可以静静地待上好久的时光。演员蓝盈莹说，自己在还未成名的学生时代，就经常来菊儿人家续饭。一瓶北冰洋配一碗卤肉饭，是演员乔杉还未成名时就养成的习惯。在偌大而纷杂的北京城，一碗无限续饭的卤肉饭或许就是那些漂泊的食客们心中为数不多的确定性。", "未来还会发生什么？小枣也不知道。但对于小枣来说，坚持把菊儿人家开下去就像坚守“我是我”一样，是一件不言自明的追求。“我一定要开这家店，把它开下去。”说这话时，小枣的眼里闪闪发光，“就像我做我自己一样不会改变。”向前看已经成了小枣的习惯。", "在小红书上，小枣给自己的标签是“乘风破浪的北京大妈”。经历过诸多困难，饭店的生意愈发成熟、红火起来。小枣知道，如果在饭店生意最好的时候选择加盟，会赚取到很多的钱。但她拒绝了这样的经营方式。对她而言，这样的利益会使人迷失方向，忘却菊儿人家的初衷。", "虽然夫妻二人并不打算对饭店进行大刀阔斧的改革，但为了应对将来未知的挑战，小枣在不断努力让饭店更加兵强马壮。她在南锣鼓巷外盘下一个二店，又将现代新兴的人工智能和机械化技术融入到饭店的经营当中。小枣每周还会带着自己的孩子来吃饭，检查门店是否按照规定流程生产，是否符合卫生标准。面对可能遇到的饭店经营的困难，小枣早已做好了准备。", "经营到现在，菊儿人家已经成为她生命中不可分割的一部分，而坚守胡同里那份原初的善意和对菊儿人家的热爱，才是小枣所追寻的目标。胡同是上天赐予小枣的礼物，更是她的使命。牢记自己使命的小枣，从未在生活中感到迷茫。", "“我作为一个胡同人，菊儿胡同就是我坚守的核心、是我的使命感。我的使命就是要让大家在胡同里面还有一个家可以回。我觉得人生最重要的就是要面对自己，我面对自己的方式就是把我收到善良再还回去。我给我的生活已经打九分了，我很满意，不过困难还是很多很多。但是不是有一句话吗？‘万物皆有裂痕，那是光照进来的地方’。生活给我出难题就是在提醒我，告诉我应该走什么样的方向。”", "当胡同代表的生活空间在现代社会的城市景观里坍塌，坚守在这样一个小小的地方、记得这些小小的一群人，是小枣作为一个渺小的普通人做出的最大的努力。小枣说，她希望自己能把菊儿人家一直这样开下去。当远道而来的食客偶然经过这个胡同口，又或是屡次拜访的老熟客再一次走过这条熟悉的巷子，卤肉饭的香气就一定能将他们带回很久很久以前某个柔和的傍晚——当金黄的夕阳洒在胡同的石砖路上，枣树挂满了香喷喷的红枣，每户人家的窗口飘出烹饪的热气，缓缓时光仿佛永远不会逝去，漂泊而劳累的内心就有了停靠的此岸。", "胡同深处有“人家”，胡同里的故事还在不断记录着、延续着、发生着。"], "excerpt": "然而，那些嗅觉灵敏的人们仍然能顺着一股香气就找到胡同里的某个角落——就像菊儿人家这样的地方。胡同直到如今还承担着一代北京人对于集体地域空间的温柔想象和怀旧情绪。", "by": "谢冰妍", "primary": true, "note": ""}, {"id": "news", "title": "我选择新闻的心路历程", "cat": "散文", "keys": ["代际", "理想", "自我叙事"], "theme": "silk", "text": ["正值秋冬换季的季节，北京的秋天不比南方，来的快、来得陡。是时候将轻薄的夏衣收起，换上厚实的秋装。这时，我偶然从箱底翻出了奶奶送我的丝巾，那是奶奶在我来北京度过的第一个春天时送我的。", "我的奶奶于1952年考取北京大学中文系新闻学专业，那时年仅16岁的她是班上最年轻、但成绩最好的学生。本科期间，一本苏联小说《远离莫斯科的地方》点燃了热爱文学的奶奶对于石油的向往。1955年，我国在新疆发现了克拉玛依大油田。60年代，国家提出“到边疆去，到祖国最需要的地方去”的口号，无数知识青年纷纷相应。奶奶毕业时，年轻气盛的她也想要去新疆，去见识苦难、去改变世界。当时正值北大新闻系迁往人大，北大和人大都希望将奶奶留在本校任教。但奶奶不愿意一辈子呆在象牙塔，系里阻拦她，她就告到教育部，最终她如愿被分配到了边疆，成为了一名编辑、一名记者、一名作家。", "生物学上讲，女性在母亲体内就会形成自己一生所有的卵细胞；因此严格来说，我在我外祖母的体内就已经开始孕育。人类代代延续的“传承”，也许比我想象中还要更早地注定，也拥有更大的力量。我想我心里那颗关于新闻的种子，大概在我奶奶年轻时就已经种下了吧！", "我喜欢听奶奶讲她采访的故事。比如采访艾滋病人时她与他们同一桌吃饭，那些病人因受到尊重而流下泪来；比如帮助在矿难中双目近乎失明的青年宣传报道，他最终带动了一个穷村走向富裕；又比如无论某些企业高管如何对她威逼利诱，她也坚持不说违心的假话……奶奶总说，她在采访时见识了许多真正的苦难，这些经历塑造了她的文风和性格。但她只字不提的是自己的苦难。文革时她被发配到农村，怀孕时仍要干农活。回到成都后，爷爷却英年早逝，留下奶奶一个人抚养两个未成年的儿子。她自此未再嫁。", "年老后，奶奶一人独居，但从她身上我却从未看到孤独——她养了一整个阳台的花，每天清晨起床晨练，然后读书、写作、写毛笔字。汶川大地震时，她已七十岁高龄，仍然深入灾区一线采访，住在余震区写作。我总想，一个人是有多热爱她的工作，才会在已经可以安享晚年的时候也一刻不停地将自己的生命和热忱投入于此！", "我羡慕奶奶的老年生活。我羡慕她有来自天南地北的曾经的采访对象给她寄来信，羡慕她桌旁萦绕的墨水和纸张的古朴香气，羡慕她的名字能被印在大部头图书的书脊上，羡慕她阅读或写作时安静又幸福的模样。我希望等我老了也能过上这样的生活。于是我总说：“我长大了要和奶奶一样当记者”。说的多了，似乎也就成了某种信念了。", "无聊的时候，我喜欢静静地坐在窗台上看楼下熙熙攘攘的人群，猜测每个人背后的故事。我爱这个世界，也渴望知道这个世界正在发生什么。我希望以我所能可以影响到这个世界的哪怕某一个角落、让这个世界哪怕变好一点。“新闻”二字，“新”是新发生的事务，更是指让世界翻新的事务；“闻”是我所闻，更是我能让他人所闻。因而我知道当我说“我想当一个新闻人”，并不是仅是一句玩笑话，那是我对世界的爱的寄托。借用鲁迅的话，我认为、我也希望“无穷的远方，无数的人们，都和我有关”。", "高考出分后，我获得了喜出望外的分数。“我想在北大读新传。”我斩钉截铁的对父母说。父亲让我给奶奶打了一通电话。父亲对我说，现在的社会做新闻会遇到比我想象中还要多太多的艰难。奶奶说，做记者很苦，但她尊重我的选择。", "父母从小是最支持我自己做决定的，于是我对招生老师说：“我想读新传”。第二天一早，招生老师就打电话来叫我去签合约。当我站在新传院楼的面前的那一天，我都没有完全分清，这似乎是感性做出的决定到底是不是一场梦。北京大学那七十年前曾经吹拂过奶奶的青春的风，直到今天还在轻抚着我的面颊。", "进入大学后，我学传媒、学传播、学广告、学电影、学艺术，似乎与传统的新闻已经偏离，我也不再仅想要做一名记者。但我仍然感谢新闻为我埋下的种子，而那颗种子早已生根发芽。我知道我想要学习新闻，我因想到我能学习新闻而感到幸福。我仍然享受在新闻课堂上汲取它的养分，然后肆意地不受约束地枝蔓下去。没准呢？以后我也会成为一名彻头彻尾的新闻人。", "奶奶将丝巾送给我时说，“北京时尚的女学生春天脖子上都围着一条丝巾”。可是七十年后的今天，丝巾已经不再时尚，我也再难在北大女学生的脖颈上看到。奶奶送我的丝巾，就这样在箱底呆了一个又一个春天。七十年前的大学生流行到边疆去，而七十年后的今天“学新闻”已经不再时尚。当年奶奶执意要去新疆，她的系主任指着她的鼻子说，你将来总有一天会后悔。奶奶留在北京的同学后来大多都非富即贵，而她一辈子到头来也只是个不甚出名的“小作家”。奶奶后悔吗？我没有问。因为我知道，在这个世界上，总有一些事，即使明知并不时尚、明知可能后悔，仍然愿意执拗地坚持下去。", "也就是怀揣着这样的心情，我选择了新闻这门课吧！于是我小心翼翼地将丝巾重新叠好，似乎手里捧着的是另一个过时的名字，叫做“理想”。"], "excerpt": "奶奶将丝巾送给我时说，“北京时尚的女学生春天脖子上都围着一条丝巾”。可是七十年后的今天，丝巾已经不再时尚，我也再难在北大女学生的脖颈上看到。奶奶送我的丝巾，就这样在箱底呆了一个又一个春天。七十年前的大学生流行到边疆去，而七十年后的今天“学新闻”已经不再时尚。当年奶奶执意要去新疆，她的系主任指着她的鼻子说，你将来总有一天会后悔。奶奶留在北京的同学后来大多都非富即贵，而她一辈子到头来也只是个不甚出名的“小作家”。奶奶后悔吗？我没有问。因为我知道，在这个世界上，总有一些事，即使明知并不时尚、明知可能后悔，仍然愿意执拗地坚持下去。也就是怀揣着这样的心情，我选择了新闻这门课吧！于是我小心翼翼地将丝巾重新叠好，似乎手里捧着的是另一个过时的名字，叫做“理想”。", "by": "谢冰妍", "primary": true, "note": ""}, {"id": "barbie", "title": "《芭比》：女性主义商业电影中的性别失焦", "cat": "影评", "keys": ["消费景观", "身份", "生命"], "theme": "pink", "text": ["2023年，由女导演格蕾塔·葛韦格执导，美国华纳兄弟公司出品的好莱坞奇幻喜剧电影《芭比》（Barbie,2023）在全球上映，引发了现象级热潮。《芭比》上映后的首映周票房就取得了历史性的1.62亿美元，成为2023年首周票房最高的电影，并以14亿美金的票房夺得2023年度十大最佳票房电影的桂冠，力压《奥本海默》、《速度与激情10》等好莱坞大片。不仅如此，电影引发的“芭比热”、“粉红热”、“女性主义电影热”也迅速席卷全球，引发一个又一个时尚潮流。", "影片讲述了芭比在两个世界中穿越与颠覆的故事，用荒诞、幽默、讽刺的手法，虚幻地描绘了颇具性别色彩和对立的“梦幻”、“现实”两个世界。电影中那些大段的、富有说教性的台词，左手高举“女性主义”大旗、右手则握着利剑直指“父权制”的现实社会。", "《芭比》无疑是女性主义电影在好莱坞商业类型片中的一次成熟尝试。从好莱坞影星玛格特·罗比、瑞恩·高斯林的倾情出演，到据称花费高达1.5亿美元的营销，再到歌舞片、公路片、探险片等多种经典好莱坞类型电影的大杂烩，都彰显出制作组在电影商业方面的野心。然而在其稍带对立意味的“女性主义”营销大获成功的同时，电影自身却在文本中不断呈现着性别议题的失焦。与其说《芭比》是一部女性主义电影，不如说这是一场关于自我追寻和身份确认的“普鲁斯特”式闪回。电影刻意为之的性别失焦则将电影的内涵指向了性别之上的一个新命题——个体、生命与存在价值。", "一 类型与议题", "女性主义的现代性危机", "《芭比》构建了一个幻想的粉色女权乌托邦——芭比乐园（Barbieland）。在芭比乐园里，女性的芭比担任了所有的社会分工——总统、大法官、医生、工程师、诺贝尔奖得主……而作为男性的肯却只是芭比的附庸，是站在沙滩上的金发“花瓶”，只在芭比看向他的视线中找到一点自我价值。强烈“塑料感”的视觉风格、高饱和度粉色的运用、超现实的视听风格和夸张的动画贴图将芭比乐园空间描绘为一个童话世界，并与现实世界建构出强烈的对立倾向。影片用芭比乐园寄托了女性主义者的乌托邦想象，并试图通过芭比乐园和现实世界的对立具象化出“女权社会”和“男权社会”的对立，以达到讽刺的效果。", "然而，自从18世纪“女性主义”一词登上历史舞台开始，女性主义者们对于女权乌托邦社会的寻找就从未停止、也从未成功。在“芭比”这一玩具商品上的乌托邦寄托显然失败了。当镜头给到穿着西装、全员男性的美泰高层，这个由高饱和粉色涂料和完美假笑堆砌起来的乌托邦谎言就被轻易击破。所谓的芭比乐园不过是资本主义向女性主义者兜售的权力想象，芭比们拥有职业、地位，却没有实际掌权的力量。而当肯从现实世界带回父权制，芭比乐园就像美洲土著对欧洲病毒一般毫无抗体，被父权制轻易地侵蚀、改造。电影过于放肆的幽默、讽刺和失真化叙述在芭比进入现实世界后并没有改变。无论是美泰高层与芭比的游戏化追逐戏，还是肯闯进金融大厦后职员的那句“我们没有放弃父权制，只是将它隐藏地更深了”，都显示出影片中所谓的“现实世界”也不过是另一个没那么“粉”的虚构世界。无论“Barbieland”还是“Real world”，都只是电影给观众提供的想象空间。观众无法在对比中找到对真正的现实社会的指认，但影片中那些关于现实议题的批判又如此直白、猛烈、说教，这种错位带给观众一种无所适从的冒犯。", "这是《芭比》作为商业化类型电影自身无法解决的矛盾。文化产品的商品属性对于文化的传播来说是危险的，消费主义可能会影响甚至消解媒体文化的内核。女性主义议题的严肃性和商业电影的娱乐性产生强烈的矛盾和冲突。当《芭比》选择用商业生产模式来表现女性主义时，就难以规避女性主义被符号化、标签化的风险——高饱和度的“芭比粉”、对男性压迫的批评和两性气质的展现都过于符号化、扁平化，以至于使得电影中的女性主义产生了意义上的偏移和失焦。", "居伊·德波在《景观社会》（1967）中提出，资本主义的最终形式在彻底实现马克思关于商品拜物教特性的分析的同时，将自己呈现为景观的规模庞大的累积。景观即“以图像为媒介的人们之间的社会关系”（德波，1967）。《芭比》通过一系列具有符号意义的图像构建了一个幻想自足的“女性主义世界”景观与一个父权制当道的“现实世界”景观。但当真实世界被转换为仿真的图像，人的实践能力就和自身分离开来了。能够赚钱的市场女性主义代替其他关乎女性的议题获得了一个不负责任却又足以支配资本主义社会所有社会生活的绝对地位，甚至操控集体感知、控制社会记忆与社会沟通。无论是在电影中还是现实中，女性主义所面临的现代性危机。《芭比》以及其背后的女性赋权语言成为了美泰进一步释放消费主义的工具，而真正关于女性权益和福祉的议题则被庞大的消费景观遮蔽，在这场消费狂欢中烟消云散。", "不过，对《芭比》商业化属性的过分苛责也属实有些刁难的意味。毕竟《芭比》在电影中通过角色之口已经对自己的商品属性有着元电影式的自知和讽刺。更重要的是，至少在在男性导演、大男主电影风靡的好莱坞，它真金实银地用票房打下了一片属于女性的天地。", "二 芭比与肯：无性之性", "虽然影片中充斥着有关性别的叙述，但《芭比》事实上在文本中有意地回避了对性别身份的过度纠结——当芭比来到现实世界，面对向她吹出性暗示意味口哨的街头工人，芭比坦然地说她和肯都没有性器官。社会学语境下的性别有两层含义：第一层是两性生殖系统天生的生理性别、第二层则是社会性别。健康的人同时具有两层性别属性，但芭比和肯作为“玩具”并没有第一性，只有被造就的第二性。没有性别的玩具社会却派生出有性别的父权、女权之争，《芭比》的女性主义是典型的“无性之性”。于是，影片将其对于性别的讨论限定在社会性别层面。正如西蒙娜·德·波伏娃（1949）于《第二性》中提出的，“女性不是生就的，而是在社会中逐渐形成的”。《芭比》用无性之性的对立展现出社会性别的后天建制性。", "可惜的是，影片对于性别革命的描述有些过于扁平和单薄，在玩闹似的革命过后，影片对于性别平等没有给出任何答案和解决方案，反而激化了性别之间的对立。肯在“父权制”的现实世界因为自己没有任何技能而找不到工作，但芭比世界的芭比们又何尝不是与肯一样无能呢——芭比们根本不会真正的医疗、写作或者治理国家，只是不同的服装或身份给她们带来了肯没有的权利。电影对于性别议题注定无法给出一个满意的解答，因为性别议题在电影中根本就不成立。在“Barbieland”这样一个没有性别、没有生育的世界讨论父权与女权社会的更替显得有些荒唐，况且芭比世界的权力来源背后是美泰公司为代表的的资本主义。在这个个体没有任何实践能力、创造能力，也不需要任何物质资料来满足生活的童话世界，导演只能用屋子的占有权来象征两性权利的更替。而当“Barbieland”变成“Kendom”，又变回“Barbieland”，这样轻而易举的革命和循环往复的性别对立根本无法解决，只会永远如闹剧般循环下去。", "《圣经·创世纪》说，亚当是世界上的第一个男人，夏娃则是他身上的一根肋骨。用“女人是男人身上的一根肋骨”暗喻“女性是男性的附庸”，是父权思想下对于男女不平等权力关系的神话起源。但在《芭比》里的芭比世界中，这种附庸关系倒置了。电影巧妙借用了美泰公司在出售芭比玩具时的逻辑——芭比是主打，而肯只作为“芭比的男友”而附带着售出。正如影片中高斯林饰演的经典版肯所说，“it’s ‘Barbie and Ken’ . There is no just ‘Ken’（只有“芭比和肯”，根本没有离开芭比的“肯”）”。芭比与肯的设定无疑是对父权制下亚当与夏娃的神话的溯源，也是对“男性天生优于女性”的讽刺。", "但肯这一角色的意义远不仅于此。电影不仅通过芭比乐园和现实世界的反复穿梭完成了芭比的角色成长，也完成了肯的角色成长。如果说芭比的成长路径是“习惯于完美——觉醒——受挫——成长”，那么肯的成长路径则是“习惯于依附——觉醒——受挫——成长”。当肯们的父权制被芭比们夺回，经典肯再也抑制不住地在芭比的粉色大床上痛哭起来诉说着自己的压力和初心——他不过也只是想要找到自己的身份认同。虽然《芭比》在性别的议题上失败了，但却在此将影片的内涵指向了一个更为深层的命题——个体的身份与存在性反思", "三 符号与生命：个体的存在性反思", "《芭比》对于女性主义的表达充满了符号象征，但芭比本身才是整部影片最大的象征符号。", "芭比诞生于1959年，她的发明者露丝以自己女儿的名字给她命名。此后的六十年，美泰公司生产的芭比娃娃逐步成为了二十世纪最为人所知也最畅销的人形玩具。2010年左右开始，随着女权运动的发展和和其他展示真实身材的玩具娃娃热卖，芭比的销量开始持续下降、一蹶不振。因其千篇一律金发碧眼的容貌、凹凸有致的身材，芭比一直以来背负着女性刻板印象、制造外貌焦虑的骂名。电影借萨沙之口不留情面的指责芭比的出现“让全体女性自卑不安”，是“性资本化”和“不正常的形体追求”的集中体现，“让女权运动倒退了五十年”，甚至是一个“法西斯主义者”。在流行文化中，芭比这一形象往往象征着父权制为压迫女性而给女性建制的性别刻板形象——漂亮、无用，满足男人的性幻想又不会给他们的地位带来任何威胁。", "《芭比》是芭比对自身符号意义的自省，是一种对“反叛的反叛”。影片一开始就以极其荒诞的场景致敬了影片《2001太空漫游》，提出了一个大胆的命题“芭比是万物之源”。具有塑料感的粉红、不能落下的脚跟和完美的芭比生活预示着“完美”对于女性的枷锁。高跟鞋和平底鞋的选择象征着女性的自由权利。而当具有强烈身体指向性的性器官和“橘皮组织”出现时，电影反复暗示的谜底就已经呼之欲出——性别权力对生命权力的指向关系。每个人出生就被赋予了性别，对于不同性别的尊重实际上是对每一个个体之为人的尊重。影片的开始，芭比的一系列故障和混乱都源于她关于“死亡”的想法——死亡在芭比世界是不被允许的。但死亡恰恰是生命的前提，是生命权力存在的隐性基础。", "法国哲学家福柯视生命本身为一种权力，而权力的基础“恰恰是通过唤起死亡之风险、唤起在生命中死亡之内在性，生命权力才得以操作。”。死亡不是生命权力的界限，而是其前提。导演无疑想在《芭比》的商业片性质之上赋予其更深的哲学内涵。电影的生命议题高于性别议题，存在危机先于性别危机。影片通过芭比和肯完成的并非性别的争论，而是关于自身作为个体身份的生命性反思。", "而导演的态度早已暗藏在影片中那些偶尔出现的、与影片整体氛围格格不入的镜头当中。芭比在逃亡中不小心闯入深藏美泰公司内部的真正的“芭比之母”露丝的房间。那个始终散发着具有女性特质的柔和、暖色调的环境光的镜头区别于影片高饱和度的童话画风。当芭比失望地对她的这位女性导师说：“现实世界和我想象的截然不同”，露丝则回答她说：“它从来都不尽人意，但这不很棒吗？”", "导演格蕾塔对此说道：“芭比是一个很好的载体，也是一个很好的角色，可以用来探索‘生而为人’的议题。”当萨沙的母亲葛洛莉亚怀揣着苦恼画出了被死亡的念头纠缠的芭比、长橘皮组织的芭比、尴尬的芭比，正是那些不完美的念头打破了芭比看似美好、实则失真的“完美生活”，引导她走向身份与生命的觉醒道路。从这个意义上来说，芭比进行自我颠覆与革命的起点一直都是生死，而不是性别。", "而解密的钥匙就藏在这一幕——芭比刚刚来到现实生活，她坐在公交车站的长椅上。她突然感受到了生命的流动。在缓慢的配乐和鸟鸣声中，她感应到了玩芭比娃娃的女孩的成长，然后她第一次流泪，看见了这个世界上正在发生的一切——行人、争吵、树木、微风，然后影片借芭比之口发出对生活的感叹“痛苦，但美好（Achy, but good）”。这一幕是电影中少有的“真实”的、非构建的场景表达。然后芭比对身旁那个长着皱纹、垂垂老矣的女性发出由衷的赞叹“你真漂亮”，老妇回答她说“我知道”。那一刻，死亡、皱纹、衰老、痛苦，都无法战胜生命的喜悦。影片指向的不仅仅是女性，而是每个人的生命。", "影片的结尾，肯和芭比都完成了对自我意义的探寻。肯决定摆脱芭比，找到自己作为单独的“肯”而存在的自我价值。芭比则决定放弃自己的“完美”生活，成为一个具有生命的人。当影片末尾，芭比成为人的第一件事是去做妇科检查时，影片完成了从性别到身体再到生命的升华。从这个意义上看来，《芭比》的性别失焦却是有意为之——性别本就是不存在的议题，关照每一个个体存在才是生命政治的最高范畴。", "【参考文献】", "[1]冯奕涵.(2023).真人电影中的类芭比形象构建——以《律政俏佳人》系列为例. 戏剧之家(14),147-149.", "[2]吴坤芃.(2023).性别视野下的《芭比》. 东北之窗(08),70-71.", "[3]西蒙娜·德·波伏娃.陶铁柱译.(2004).第二性(全译本).中国书籍出版社.2004年版.", "[4]申丹.(2004).叙事形式与性别政治——女性主义叙事学评析. 北京大学学报(哲学社会科学版)(01),136-146", "[5]贺翠香.(2023).当代西方女性主义研究中的性别身份问题. 国外理论动态(04),69-76.", "[6]吴冠军.(2015).生命政治:在福柯与阿甘本之间. 马克思主义与现实(01),93-99. doi:10.15894/j.cnki.cn11-3040/a.2015.01.014.", "[7]吴家丞 & 戴雪红.(2022).生命政治论的女性主义解读——以权力的三重向度为视角. 国外社会科学(04),171-181+200-201.", "[8]李晗.(2019).新媒体文化产品中“女性主义”意义的偏移和消解——基于消费主义视角的研究.新闻研究导刊(01),55-56+124.[1]崔洁.(2023).景观社会视阈下的饭圈建构. 声屏世界(13),102-104.", "[9]周慧晓婉:《对话玛格特·罗比和瑞恩·高斯林:拍<芭比>是迎难而上》，新京报，2023-07-23，"], "excerpt": "《芭比》是芭比对自身符号意义的自省，是一种对“反叛的反叛”。影片一开始就以极其荒诞的场景致敬了影片《2001太空漫游》，提出了一个大胆的命题“芭比是万物之源”。具有塑料感的粉红、不能落下的脚跟和完美的芭比生活预示着“完美”对于女性的枷锁。高跟鞋和平底鞋的选择象征着女性的自由权利。而当具有强烈身体指向性的性器官和“橘皮组织”出现时，电影反复暗示的谜底就已经呼之欲出——性别权力对生命权力的指向关系。每个人出生就被赋予了性别，对于不同性别的尊重实际上是对每一个个体之为人的尊重。影片的开始，芭比的一系列故障和混乱都源于她关于“死亡”的想法——死亡在芭比世界是不被允许的。但死亡恰恰是生命的前提，是生命权力存在的隐性基础。", "by": "谢冰妍", "primary": true, "note": ""}, {"id": "li", "title": "李玲", "cat": "故事", "keys": ["症候", "记忆", "身份"], "theme": "rain", "text": ["十一月份的雨最恼人，像背脊骨上的季节性荨麻疹。", "在这样的天气下，城市里没有一个人是舒坦的。每当这个时候，她总感觉有大块的雾气结在肺里，痒刺刺的感觉顺着黏湿的雨雾从下水道爬上皮肤，鼻腔里充斥着脏污的情绪。所以在这种天气，非必要情况下她不出门的。可是她今天不仅出了门，还意外地遇见了她觉得自己恐怕这辈子也遇不见的人，这让她十分恼怒。客观上来说，她是应该高兴的。只是这不合时宜的天气把这件好事变得糟透了。", "现在，这个男人就和她对坐在咖啡店的靠窗的卡座里，两个人都没说话，温度过高的空调把他们的脸蛋熏得红扑扑的。女人感到不安，还有点犹豫，一股隐隐的痒顺着她的脊背向上蹿，大概是荨麻疹又发了。她悄悄地靠着椅背摩擦背部，并同时试图吐出几个能引起话题的词语。但这两件事都是徒劳的。椅背没找着她的痒处，男人也并没有接她的话茬，只是用一种礼貌得有些过分的姿态把咖啡杯子搅得叮当响。女人这才觉得热了，她摆出一副娴熟的样子招来服务员责问空调温度。看起来不过高中生年纪的女服务员支支吾吾说不出话来。", "“把大衣脱了就好些了，我也脱了吧。”男人打着圆场。他觉得他们俩就如同两个死活打不出喷嚏的可怜人儿一般憋屈。", "女人捂着嘴嗤嗤地笑了，服务员识趣地退场。她看见男人的脸部肌肉在一瞬间似乎按照她熟悉的方式重新舒展开了，只是顷刻间又恢复了之前的样子。但这逃不过女人的眼睛，就在刚才她还怀疑自己是不是认错了人，但这个表情出卖了他。不过，这仍然不是女人要的答案，她大起胆子来，任由自己带有些许攻击性的目光刺穿男人厚厚的黑框眼镜，妄图在他失神的眼睛中找到点线索。突然，她有了灵感。", "“你还记得李玲吗？”", "“李玲？”男人稍微尝试在记忆中搜索这个普通得要命的名字，但他大脑中的高中生活在早些时候已经蒸发得干干净净了。", "女人有点失望，她咬着嘴唇，深红色的唇膏粘在了她的牙齿上。“你肯定记得的，她以前追过你，全班都知道。”", "“哦。”男人其实并没有听清楚女人说了什么，他在拼命憋住一个汹涌而来的哈欠。其实她在他面前那有点羞赧的神情使他感到异常烦躁，他并不明白她为什么要这样做。同时他还盘算着，虽说是女人发出的邀请，但好说歹说他也必须得来买这个单。", "“对不起，我……”他久久憋出一句话来。", "这很正常，女人心想。李玲大概不是个特别到值得记住的人，她好像又挑错了话题，但她硬着头皮继续了下去。“你一定记得的，就是死了的那个。”", "男人的眉头拧了起来，他望向窗外灰色潮湿的街道，终于被迫一头扎进那他并不想再次想起的高中生活。这让他十分痛苦，同时他又对自己的痛苦来源感到莫名其妙。优异的成绩、良好的人缘、兴趣爱好广泛，他找不到自己为什么会感到痛苦。", "片刻他吐了一口气，五官变得生动起来，“我记得她。”", "女人不知道该如何对男人的话做出反应，她应该合时宜地说些哀悼或者褒扬死者生前品行的话，但她其实对于这个话题感到很无趣。不过看到男人的眼睛里终于有了些生气，她仿佛受到了鼓励。", "“其实……当年我也挺喜欢你的。”", "女人说这话时很奇怪，像是透过了男人的身体在看向后面的什么地方。她自己也不知道为什么会突然这么说，她工作之后告诫自己永远不要做没有意义的事，事实上这将近二十年来她也是这么做的。但她刚刚显然做了一件没有意义的事情，不过她觉得那句话就像一个憋了许久的喷嚏，打出来了，她现在痛快了许多。", "“二十年后的今天，你或许发现了你眼前这个人并没有什么值得被喜欢的。所以，你得庆幸当时你没选择我。”男人觉得这个话题很尴尬，他努力地想用一点自己的幽默感来化解危机，但他从女人的表情里明白他刚刚做了一个失败的尝试。同时，他觉得一种刺辣辣的感觉加重了。他想让话题回到李玲身上，他对这个已经死了的、曾经喜欢过他的女孩产生了莫大的兴趣。他重新谨慎地在自己的记忆里打捞了一遍，一个模糊地影子渐浮了出来。男人似乎终于找到了她，这个被他当时的自负与现在的自卑故意抹掉的身影。可是他怎么也想不起她的样貌了，他突然后悔自己这二十年来过于用力地刷洗了自己的记忆，使得一片本该忧愁得恰到好处的记忆丢掉了。有什么湿漉漉的东西黏在他的下巴上了。", "女人眼看着男人的泪滑了下来。那是属于李玲的泪。她有些受不了了。那个胆小的女服务员好像真的跑去关掉了空调，她觉得外面的寒气从玻璃透了进来，她裹上了自己的大衣。那种熟悉的感觉又回来了。她努力看着眼前的男人，却丝毫感受不到自己是在他的面前和他说话。她觉得自己看着的还是他的背影。那个挺拔的、潇洒的背影，而她的视线却愈发无力，颤颤巍巍的。女人似乎慢慢往下滑，一直要滑到桌子底下去了。", "“其实李玲的死和你有关的。如果那天你转头看了她一眼，她或许就不会死了。”这句话里的恶意让女人觉得陌生又畅快，一种优胜者的姿态就爬了上来。男人低着头，保持着适量的沉默，突然就矮了下去。女人感觉自己仿佛重新从桌子底下爬了起来，她正视着男人的脸，觉得他变得有点丑，于是自己说话也变得硬气了起来。", "“其实你根本没有认出我来。”女人抻直了脖子。“因为我就是李玲呀。”", "男人望着眼前这个女人的脸，像是看着一只深海鱼。而在男人的脑袋里，李玲的脸终于的就清晰了——那个长相普通身材普通的高中同桌。男人为自己脸上的泪水感到恶心，眼前这个女人的脸和记忆中的李玲相重叠，恶毒又愚蠢。", "女人很快发现，男人显然被这个恶作剧给激怒了。因为他忘了保持应有的礼貌，脸部肌肉又如同高中时那样肆意地延展开来。他甚至忘了自己应该请客的事儿，头也不回地走进雨里。", "女人茫茫地看向十一月的街道，里面穿插着男人如二十年前一样的背影。他最终留给她的还是这样一个背影。女人讪讪地笑了，心里有块东西又滑到桌子底下去了。而窗外，十一月的雨如常地下着，它淋在布满灰尘的乔木叶子上，淋在满是泥浆的砖缝里，淋在女人阳台上未干的枕套上，淋在男人永远来不及晾干的雨伞上。它冲淡刺痛瞎子蚯蚓的阳光，混淆自卑者与自信者的灵魂，模糊所有幸运和不幸的人的过去，打湿满载生者和埋着死者的土地，最终落在“李玲”和李玲的身旁。"], "excerpt": "女人茫茫地看向十一月的街道，里面穿插着男人如二十年前一样的背影。他最终留给她的还是这样一个背影。女人讪讪地笑了，心里有块东西又滑到桌子底下去了。而窗外，十一月的雨如常地下着，它淋在布满灰尘的乔木叶子上，淋在满是泥浆的砖缝里，淋在女人阳台上未干的枕套上，淋在男人永远来不及晾干的雨伞上。它冲淡刺痛瞎子蚯蚓的阳光，混淆自卑者与自信者的灵魂，模糊所有幸运和不幸的人的过去，打湿满载生者和埋着死者的土地，最终落在“李玲”和李玲的身旁。", "by": "谢冰妍", "primary": false, "note": ""}, {"id": "rule", "title": "规矩", "cat": "故事", "keys": ["民俗想象", "世界观", "禁忌"], "theme": "river", "text": ["河水村不大，临着河，像一颗饱满的麦粒镶嵌在山窝窝里。河水村的男的女的十八岁要在河边举行祭河仪式，才算是成了个人。河水村有一条规矩，没祭河的娃娃是不准靠近河的。河水村的老人们说，小娃娃有顽气，太清灵，像地里的萝卜，还只半只身子接了人气，河神见了，就得掳走。这一掳，小娃娃就随了河，不随爸妈了。满十八岁的时候，小娃娃因在农田里滚了许多年，才算两脚沾了地，得去拜拜河神。河神一看，浊了，就不要你了。", "大约是河水村的娃娃都长得水灵，眼睛汪汪的，让人总想起河面的霞光，人们便更坚信娃娃是河神给的，生怕被卷了去。", "小娃娃是最不愿遵守大人的规矩的，但河水村的娃娃却都守着这个规矩，就连最嚣张胆大的白二也不敢去河边。倒不是他们听话，他们都怕河边的小破屋，怕里头住的吃人的何疯婆。况且，山间地里，好玩的太多了，谁非得赖着这个河呢。", "白二是典型的河水村的娃娃，脸就像刚磨好的白面，眼睛好像春天早上朝云含着的太阳。白二看着文文静静，却是河水村最躁的娃。白二的妈原是个温柔娴静的女人，生了白二后边常拿根木条子满村追着白二打。妈打他的时候，白二就跑到村里人的屋子里，村里人都护着他。村里的姑娘们也喜欢白二，白二一跟她们说话，脸蛋子就红的和野草莓一样。村里人常开玩笑说，白二你逮着哪家姑娘啦。白二就挠挠头，妈说了，我今年秋天才祭河嘞，现在不能逮姑娘。", "村里的人都待人好、守规矩，何疯婆是个例外。女人们在河边洗衣服，她那个破屋子就歪歪扭扭立在河边。新嫁来的女人往往不知道何疯婆的故事，村里的女人就给她们讲，虽然她们自己也摸不准。", "女人们说，何疯婆不干净，自己还没祭过河就怀了个娃娃，那个男的却不要她了。河神见她坏了规矩，发怒了，涨了水，还把娃娃收走了，何疯婆就疯了。女人们绘声绘色，末了不忘语重心长地警告一句：河神的规矩，不能坏啊。新来的女人们就回家告诉娃娃们：河边的屋子里住着一个吃娃娃的巫婆。", "白二近日里兴致很高，还几天他就祭河了。歌声回荡在村里，村里人也都看他高兴。到了祭河的前一天晚上，白二坐在山坡上，他不想回家。这天月光很亮，染着麦子的香气淋在白二身上，他觉得舒服极了。他面对着河，河水柔丝丝的，在月光下格外诱人。白二听到河水流动的声音，嘴里仿佛生出点甜香。白二想，反正自己明天就祭河了，于是爬起身，一溜就到了河水边上。河水真清，上面浮动着明明灭灭的光斑。白二觉得有人看着自己，一回头就看见一个女人立在树底下，他感觉自己的太阳穴突突直跳——他碰上何疯婆了！", "可随即他就傻眼了，何疯婆哪是疯婆子，分明是一个消瘦却美丽的女人，眉眼艳艳的、灿灿的，一张鹅蛋脸在月光下白得吓人。女人穿了件贴身的红旗袍，依着河边的一棵树，身子像没骨头一样柔软。白二的视线溜溜地在女人身上流动，然后撞到了她的目光。一个瘦弱的女人竟然有这样滚烫的目光！白二的眼睛也烧了起来，河里的光斑也燃了起来，女人水似的皮肤直往白二手里钻，白二觉得女人眼里的火顺着她和他的皮肤烧到了他身上，让他麻得有点窒息。白二只感觉一股温热湿软的鼻吸探进他的马褂，他痒，他战栗了。女人的手冰凉凉的像河水，白二想跳进河里，让清凉的水灭一灭皮肤上又痒又疼的火苗。", "“你怎么回来了？”白二被吓了一跳，身上烧的火也退了，他四下看看，没见着别的人。何疯婆又念叨了两句，他这才看出何疯婆是疯了。他要跑，河边的泥滑，他就一屁股坐进河里。白二随即听见一声锐利的尖叫，扑通，什么东西掉进河里，然后就不知道什么了。", "村里人发现白二时，他昏在河边，浑身湿漉漉的。白二发了三天的高烧，老人说，白二好歹满了十八，才捡回一条命。白二却迷迷糊糊地总念叨，河边的小娃娃得会水性。", "没两天，有人在下游的水草丛里发现了肿胀的何疯婆，女人们和小娃娃们就知道吃娃娃的老巫婆已经死了。", "后来，河水村的规矩不知怎么就没人记得了。亮晶晶的河水里，到处都是清亮亮的洗澡的小娃娃。"], "excerpt": "河水村不大，临着河，像一颗饱满的麦粒镶嵌在山窝窝里。河水村的男的女的十八岁要在河边举行祭河仪式，才算是成了个人。河水村有一条规矩，没祭河的娃娃是不准靠近河的。河水村的老人们说，小娃娃有顽气，太清灵，像地里的萝卜，还只半只身子接了人气，河神见了，就得掳走。这一掳，小娃娃就随了河，不随爸妈了。满十八岁的时候，小娃娃因在农田里滚了许多年，才算两脚沾了地，得去拜拜河神。河神一看，浊了，就不要你了。", "by": "谢冰妍", "primary": false, "note": ""}, {"id": "grave", "title": "上坟", "cat": "故事", "keys": ["儿童视角", "死亡", "情感"], "theme": "mist", "text": ["小满喜欢跟着爸爸妈妈去给小叔上坟。", "上坟意味着要上南山去。小满四仰八叉躺在车的后排座，把头靠在奶奶的腿上。小轿车在弯弯绕绕的盘山公路上爬行，窗外是一大片一大片的树林子，山里的东西都水灵灵的，漂亮得紧。小满打开了一点点窗户，带着泥味儿的空气就乖乖跑进来了一点。这个味道与城里的味道太不一样了，妈妈鼻子不灵也闻到了，她让小满把窗子关上，奶奶吹了冷风会着凉。小满有点不开心。", "车子在山里面越拐越陡，慢慢的，小满真正觉得自己在山里了。明明没下雨，到处却都是湿漉漉的。小满盯着窗外毛茸茸的山尖尖，里面一定藏的有很多小动物，还有很多恐怖的小虫子，当然还藏着小满喜欢的折耳根。小满嘴里仿佛生出了折耳根的味道。她喜欢上南山，每次给小叔上坟到时候，都是折耳根长得最旺的时候。以前每次上完坟，奶奶总会带着小满去采野折耳根。南山里的折耳根有南山的味道——有南山水的腥味，有南山泥巴的涩味儿，有南山空气的甜味儿。小满眼睛尖，能比奶奶多采很多。车子顺着河边走，小满发现自己比河走得快多了，可是河是走不完的，小满却很快就到了目的地。", "以前每次上坟，妈妈都允许小满在车上呆着不下去，可是这次妈妈命令小满一起去。小满对叔叔没什么印象，她只知道她出生没多久叔叔就死了。小满家里的人都很喜欢叔叔，说他是世界上顶顶好的人。小满不这么觉得。每次家里只要一提起叔叔，家里的气氛就会一下子变得很奇怪，妈妈还会垂起泪来。小满爱她的家，她的家人们也爱她，但她不喜欢家里提到小叔的时候。而且隐隐的，小满觉得那个时候大家不爱她。", "小满看见爸爸停了下来，爸爸面前是一个土包，土包的周围围着一圈郁郁葱葱的树。小满也停了下来，妈妈和奶奶也停了下来。小满看着爸爸妈妈忙来忙去地把红袋子里的东西拿出来摆在土包面前。爸爸点燃蜡烛，妈妈让小满也要去拜小叔。小满，快来，让叔叔看看你。妈妈说。你在心里给小叔说话，小叔会听到的。小满抬头，妈妈果然又流眼泪了。小满闭着眼睛，双手合十放在胸前。", "小叔，你真不乖。你为什么要去世呢？小满闭着眼睛，她很虔诚。", "小满感觉有什么凉凉的东西落在自己鼻尖。她睁开眼睛，蒙蒙的细雨从云里面漏下来，打湿了叶子，也打湿了小满的眼睫毛。这场雨让接下来到仪式变得很麻烦，火总是点不燃。爸爸妈妈和奶奶一直忙活到雨停。花了太长时间，而小满惦记着她的折耳根。一年大家只会来一次南山，小满不耐烦地对奶奶撒娇，奶奶，真麻烦，能不能快点弄完，我还要去采折耳根呢。", "小满说出这句话的同时，爸爸的巴掌就落在小满身上了。小满被打得有点懵，她看了看奶奶，平时疼她的奶奶也别过头不愿意看她。愣了许久，小满才想起来哭。但她更惊讶爸爸居然打了她。小满觉得很气，她越发生小叔的气了。她一头扎进林子里。", "树林里什么也没有，一眼望去全是树。小满听见窸窸窣窣的声音，是风。风灌进小满嘴里，小满尝到了和折耳根一样的南山的味道。小满看见地上冒着一簇折耳根。她站在满是林子的山里，阴森森的，她觉得有点冷，有点害怕，还有点孤单。她突然有点心疼小叔，她觉得自己死后一定不要埋在这里。", "小满知道爸爸跟在后面，但小满不愿理爸爸。", "小满，你是大孩子了。爸爸说。", "小满委屈的很，她才不要做大孩子。", "小满，大家都很爱你，小叔也很爱你。小满转头看爸爸，爸爸半裹在湿答答的雾里，小满哭花了脸，眼睛亮晶晶的，像山里挂在草上的露珠。", "爸爸走到小满边上蹲下，他踩着落叶，发出微微的破碎的声音。当年你生下来，我弟弟可喜欢你了，他就想要一个女儿，想给女儿梳辫子。弟弟天天来看你，爱你就像爱亲闺女。后来你满月的时候我弟也在我们家，谁也没想到大地震就这么来了，我和妈妈都找不到你，你和你小叔埋在一起了。我和你妈妈被救出来之后都不愿意走，我们求着消防队员，我知道你还在里面，我弟也还在里面。后来消防队把你们挖出来的时候，你脏兮兮的，像个小猪，哭背过去了。我弟就在你旁边，他真勇敢嘞，半个身子都被压死了，还护着你，就这样，他还能睡着……", "小满有点喘不过气来，她眼睛发干。南山的叶子被雨水融化，滴在她的头发上。从泥巴里钻出一阵南山的味道，浓的小满有点呛。她偷偷把手里一把折耳根埋在土包包的旁边，她闭上眼睛，双手合十放在胸前。", "小叔，树林子里有好吃的折耳根，所以你不要害怕，也不要孤单，明年清明的时候，我还来给你上坟。", "小满闭着眼睛，她很虔诚。"], "excerpt": "树林里什么也没有，一眼望去全是树。小满听见窸窸窣窣的声音，是风。风灌进小满嘴里，小满尝到了和折耳根一样的南山的味道。小满看见地上冒着一簇折耳根。她站在满是林子的山里，阴森森的，她觉得有点冷，有点害怕，还有点孤单。她突然有点心疼小叔，她觉得自己死后一定不要埋在这里。", "by": "谢冰妍", "primary": false, "note": ""}, {"id": "two", "title": "一个人，两个人", "cat": "故事", "keys": ["意识流", "身体", "轻悬疑"], "theme": "room", "text": ["陈晓雪跌跌撞撞从厕所摔出来，一头撞上了等在外面的丈夫。丈夫涨红了脸，匆匆冲进厕所，没来得及瞥一眼陈晓雪的脸。如果他这么做了，他一定会注意到陈晓雪异常的表情，如果他再仔细些，或许还会发现陈晓雪袖口掖着的条状物（显然，初夏薄薄的袖子并不能起到良好的遮挡效果）。", "厕所的门在陈晓雪身后重重关上，震得她浑身一哆嗦。陈晓雪听见丈夫撒尿的声音，很爽快。陈晓雪家只有一个厕所，显然，陈晓雪让丈夫在门外憋了太久。陈晓雪呆呆地听着那畅快的水流声，觉得有些异样，就用手揩了一把脸。原来是她的泪腺也默契地与丈夫同时决堤。", "抽水马桶的声音响起，陈晓雪连忙躲进卧室。丈夫在外面叫她，说有聚会要去。陈晓雪知道丈夫不过是通知她一声罢了。丈夫也并没有期待她的回答，砰的一声，这个家就只剩她一个人了。男人出门时大多数不太磨蹭的。陈晓雪这才颤颤抽出右手袖口的那根条状物。", "卧室没有开灯，夫妻俩今早忘了开窗，昏暗的空气中还闷着俩人昨晚睡觉呼出的浊气，没有光源，陈晓雪半坐在床头，她觉得有点闷得慌，但怎么也不愿意下床开个窗子。陈晓雪打小就是孤僻的性格，她讨厌太灿烂、太美好的东西，她嫌不真实。她自己更是从不闹腾，每每丈夫一走，整个家都沉下来了，闷闷的，暗暗的，不刺眼，不明亮。", "除了她手上那根两条杠的验孕棒。", "确实是两根，不是一根，陈晓雪清楚得不得了。", "夜色渐厚，从外边渗漏进卧室，陈晓雪隐隐听见一些来历不明的夸张的喘息声。她胆子向来很小，此时却发现自己异常冷静，她聚精会神地听了一会，觉得这个声音是从床底下传来的，于是便奋力将半个身子探出床沿，手拐子不当心狠狠磕在床板上。陈晓雪怕痛得要紧，这一吃痛便缩手，身子失去支撑，一声巨大闷响，卧室里的空气就被她搅得翻滚起来。陈晓雪觉得脑袋一股一股的疼，她看见搅得花花绿绿的空气，一股闷气被翻开，她干呕了两声，然后扭曲地龇着牙。躺在地板上，陈晓雪只觉得卧室里的陈设颠倒扭曲，没来由的，心里头咚咚咚的，手心直冒汗。她猛然发现自己手脚冰凉，而且那粗重的呼吸声，却是来自她自己。", "事情是怎么发生的呢？陈晓雪脑子嗡嗡地疼。她自小身体不好，还喝过两年的中药，最后也不了了之，所以最初两个月没来月经时她并没有太多在意……她怎么能连这个都不在意？陈晓雪使劲按着太阳穴，妄图阻止脑袋里一汩一汩冒出来的眩晕。陈晓雪明确地对丈夫宣布过她还不打算要孩子。按理说她和丈夫每次都做好了万全的措施，那么这孩子……又会是从哪儿蹦出来的？莫非真是母亲给的送子观音送来的？陈晓雪想到这儿，胸口烫得要命，她竭力连拉带扯弄下胸口的挂坠，轻飘飘的劣质金属材料泛着诡异的光。", "陈晓雪想爬回床上，但骨头跟摔散了似的，硬是直不起身子，只好作罢。她安安静静躺了一会，忽的想起了什么，随之一阵剧痛就从肚脐眼而往脑子里钻，痛的她两眼翻白，眼前生出个张牙舞爪的一滩烂粉色的怪物，蠕动着啃她脑子。陈晓雪叫了一声，她感觉一阵暖流漫过她腹部。她心里一空，连忙用手去探，一摸，干的。陈晓雪眼睛却湿了。", "陈晓雪愣了神，觉得自己神神叨叨的，就耻笑般哼哼了两声。痛觉慢慢过去了。陈晓雪屏住呼吸，她想听到点什么。她不知道自己在期待啥，或许是电话铃声，或许是门锁转动的声音，又或许是——总之必须得有什么不同，一些该有的、与平时不同的动静。", "可是她失望了，什么也没有。她想不通。屋子里的空气沉下来，紧紧压着她。这里只有她陈晓雪一个人。", "不对，是两个人。陈晓雪差点把它算漏了。", "陈晓雪意识到这一点时，浑浊的空气又开始翻滚，她头晕目眩，一阵恶心密密麻麻浸润她的皮肤，她开始狂烈地干呕，像是要把子宫呕出来。"], "excerpt": "厕所的门在陈晓雪身后重重关上，震得她浑身一哆嗦。陈晓雪听见丈夫撒尿的声音，很爽快。陈晓雪家只有一个厕所，显然，陈晓雪让丈夫在门外憋了太久。陈晓雪呆呆地听着那畅快的水流声，觉得有些异样，就用手揩了一把脸。原来是她的泪腺也默契地与丈夫同时决堤。", "by": "谢冰妍", "primary": false, "note": ""}, {"id": "camel", "title": "骆驼和她的电影绿洲", "cat": "人物与非虚构", "keys": ["迷群", "公共空间", "归属"], "theme": "cinema", "text": ["骆驼不属于那种娇小女孩儿的类型。有些女孩瘦瘦的、林黛玉似的，叫人一眼就知道她是个文艺青年，而骆驼不是那样的姑娘。影迷骆驼是一个很像骆驼的姑娘——我们都这么认为——她如骆驼一般坚定强壮、如骆驼一般宽厚温柔、如骆驼一般独立地行走着，特别是有着一双像骆驼一般深邃而亮晶晶的眼睛，偏偏总是带着笑意。影迷骆驼最喜欢骆驼的眼睛。", "每年春天举办的北京电影节是一场影迷们的狂欢，热门电影往往一票难求。北影节也是骆驼的节日。每年这个时候，骆驼都拿着提前列好的清单，在北京各个电影院之间来回赶场，今年也不会例外。在北影节的收票群里，骆驼发布了一连串的收票信息，吸引了我们的注意。她十分爽快地答应了我们的采访请求，然后从她满当当的观影表中找了个空当与我们相见。她根本不像一个采访对象，而是像个大姐姐一样与我们谈着关于电影的一切，分享彼此最喜欢的电影。在甜品店，她执意要请我们吃茶和冰淇淋。", "电影对她来说是什么？在这茫茫的北京城，于自己茫茫的人生里，骆驼本来按部就班地慢慢行走着，但电影却成为了她的驻足、她的绿洲。", "骆驼的迁徙和找寻", "骆驼不是北京人，她来自天津。回忆时，她把这里看作她电影爱好生根的地方。小时候，骆驼所在的小学经常组织学生去看电影，不过彼时她并不是很享受，只当完成任务。初中时，她偶尔也看电影。对于初中生来说，电影倒不是有什么特殊的含义，只是觉得有趣便去看了。", "“从那个时候我其实就觉得自己喜欢看电影。后来上高中上大学也看，但是也就是跟咱们偶尔去逛个街一样了。”小时候的骆驼抱着单纯的新鲜感和趣味去看电影，遇到另外什么有趣的事就将电影抛掷之脑后了；喜欢电影就像喜欢吃苹果，没有苹果也可以吃橘子。或许小小的她未曾想到，电影的种子已然在她心里发了芽。现在的骆驼已经离不开电影了，“现在喜欢电影就跟需要空气一样，我每天都要呼吸。我不一定每天要看电影，但是我一定要看电影”，骆驼这样说。", "电影见证了骆驼的迁徙。骆驼是在天津上的大学，谈着一段稳定的校园恋爱。2010年，骆驼大学毕业来到北京工作，距离和双方家庭之间的矛盾让她与男友分手了。她失恋了，在北京也没有什么认识的朋友了，她感到有些孤独。她想起了她儿时的伙伴，她开始重新找电影看。至此之后，电影重新成为了填满她时间的事情，给她带来快乐。这份来自少年时代的愉悦，慢慢转变成了一种幸福。对于骆驼来说，电影意味着很多东西——是她享受时光的方法、迷茫时的寻找、还有社交。她说，迷茫时，她总在电影里寻找着-——或许是答案，或许仅仅享受这个找寻的过程。", "白天的骆驼忙于工作里的人情世故，那些业务、关系让她感到无比劳累。但只要下班后看上一部电影，她就能感受到无比轻松。她不在乎那是什么主题的电影，是悲剧还是喜剧——即使是那种看完心里闷闷的很悲苦的电影也能让骆驼感到放松。骆驼需要这样与自己独处的时间，她喜欢独享自己最喜欢的东西。“你有一个自己内心的小世界，别人进不去。”她在北影节上认识的好朋友这样评价她。“她的评价我觉得很犀利”，骆驼赞同这样的评价，“我不会跟别人轻易分享我最喜欢的东西”。", "电影《一一》里说：“电影发明以后，人类的生命至少比以前延长了三倍。”电影扩展了骆驼的生命体验，也一定程度上改变了她看待世界的角度和为人处事的方式。电影为骆驼展现出完全不同的人生选择和可能性，让她看待人和事物不再有着黑白分明的单一的评判标准。电影和电影书给予了骆驼差异化的视角，她不再抨击那些“错”的人和事，而是以共情与理解去原谅其合理性。", "也许正是对电影真正的热爱使她看起来如此包容。骆驼并不是一个典型影迷，更多的时候，她更像一个光影中的流浪者。骆驼喜欢去尝试看很多自己没看过的电影，自己特别喜欢的电影则会反复看——她最着迷的电影《她(Her)》和《热天午后》已经不知道被看了多少次，电影原声带都反复听过。和大部分影迷不同，骆驼从不挑剔电影类型，无论是商业片还是文艺片她都爱看——无聊的“大闷片”她看；荒诞而缺乏叙事的她看；剧情丰富的片子她看；经典的大师之作她也看。只要这个电影有某一个方面吸引了她（无论是海报、名字、剧照），她都会赴约影院。一旦骆驼决定买票坐在影院的座位上，再无聊的片子她也会全神贯注地看完。虽然现在她偏好文艺片，但骆驼并不认为电影类型之间有什么高低之分，也不会因为电影品味的不同去评价身边的人。无论一个人是否有同样的电影品味，甚至无论是否喜欢电影，都不影响他在骆驼心中的地位。", "骆驼是个很有条理的人，在电影上也是如此。她仔细收藏了几乎所有看过的电影的票根，还会列一张属于自己的电影表，上面标注上电影的上映日期、导演、时长、票价、看的日期、座位、和谁一起看的、是什么主题……还有自己主观的评分。每年她都会出一张表，年末再统计一下一年内和谁看的次数最多、去哪个影院最多、哪个月看电影的频率最高……骆驼乐此不疲。她自己也随着那张空白的表一起，任由自己的心灵在观影的历程中被慢慢填满。", "今年北影节，骆驼给自己计划了29场电影，买到了26场，看了26场，她已经很满足了。往年她总是看到喜欢的电影就会买票，不考虑电影院之间的距离和两场电影之间的时间，无论转场需要多久她都不在乎。有一次刚从最西边看完百老汇影院的电影下一场就在东边，她只好拼命飙车横跨北京城。“当时不会觉得累，因为兴奋不会觉得累。”骆驼回忆起来也觉得不可思议，“看完了会很累，我觉得我太累了。”今年的场次安排的很合理，骆驼以自己家附近的那家影院为主线，再安排其他支线影院。虽然看的唱词可能减少了一些，但骆驼很开心，她觉得自己找到了适合她自己的观影节奏。", "自从到北京来之后，骆驼爱上电影已经有十余年了。她在北京不断迁徙、找寻，最终发现电影是她放置自己的最好方式。就像开放世界游戏总要玩家自由探索后找到一条主线，骆驼找到了属于她的北京地图，在各个影院完成属于她的主线任务，获得她的经验与升级。", "骆驼和她的绿洲", "对于骆驼而言，如果沙漠有绿洲，那么一定是电影院的模样。常常行走在沙漠中的骆驼们心中都有一张沙漠中的绿洲图；而影迷骆驼心中的北京地图，是由一个个影院的相对位置组成的。", "不过骆驼说，她是有点“三分钟”热度的人，很容易对事情感到好奇。兴趣一旦产生，她必定会度过一段疯狂投入这项事情的“热爱期”，但这个热度很快就会褪去。骆驼刚刚爱上电影的时候，也以为这不过只是她众多“墙头”中的一个。她爱得疯狂，一周有六天都泡在影院，每周看上十几部电影，这样坚持了一年。", "骆驼对影院的特殊感情或许源于同童年，那时的影院对骆驼来说是一个秘密基地。初中时她放学后常常和发小约到一起写作业，写完作业闲来无事便一起到学校带她们去过的影院度过其余的闲暇时光。骆驼印象最深的电影是任贤齐演的《夏日么么茶》。她和发小都特别喜欢任贤齐，“我们看了三遍，连着三天都去看同一场电影”。", "到了现在，网络上的电影资源十分丰富，但是骆驼还是更偏好在电影院看电影。影院是骆驼对于电影的偏执。骆驼觉得影院和家里是很不一样的。总的来说，在家里看电影像一种消遣，而在影院看电影却能让她专注地关注大荧幕上的每一个画面。一方面，只有影院才能给她提供很多人一起看电影的氛围，骆驼喜欢这个氛围。另一方面，无论家里的观影设备有多好，都不如影院的大荧幕和音响能呈现出那样丰富的细节。有些电影则需要专注，如果不在影院骆驼可能根本就看不进去。“这个东西还是很重要的。比如说塔可夫斯基的片子，我觉得在家看是没有那种感觉的，你甚至都看不清楚。但是在电影院看就能体会到那种庞大的史诗感。”骆驼举了个例子。", "骆驼喜欢去艺术影院看电影，她几乎每天都去看。她一开始也是去普通的商业影院看商业片。大多商业片都不过是贴着类型的商品，骆驼逐渐发现这些片子不再能满足她的精神需要。她在网上搜索，然后邂逅了那些艺术影院——像是百老汇影院、中间影院、电影资料馆——这些都是她很喜欢也很频繁去的影院。艺术影院满足了她对观影环境的要求。去商业影院观影的观众可能是为了娱乐、休闲、放松才去的，但去艺术影院的观众大多都是纯粹地为了欣赏电影。在艺术影院，观众席静悄悄的，大家都在专心欣赏电影，这是商业影院做不到的观影环境。", "不同的影院有不同的风格和长处，骆驼对这些细节如数家珍：电影资料馆的片单最丰富，有着许多国外的片子和国产老片，因为它的管理平台最大、资源最丰富。百老汇影院是香港开进来的，有自己的独立性，每年都会做国别展，例如“日本动画大师展”，骆驼有时间都会去。中间影院在北京西边，交通不太方便，去的人比较少，但是兼有话剧和喜剧类的电影放映。", "说起这些，骆驼变得比她看起来要健谈，她那双亮晶晶的眼睛里透出兴奋的底色。如果这些艺术影院拥有人格，骆驼觉得这些影院大多都是女性——并不是出于什么女性主义的目的，她只是觉得应当是这样：电影资料馆是一个体制内或者大型央企的主管姐姐，有威严而又优雅，偶尔也比较谦和；或者是一个偶尔有点幽默感的中年男性，和他的下属打成一片，有的人会觉得他高高在上，但骆驼心理不是这样的。百老汇则有点小高冷，像是那种30岁左右的很有气质的年轻女性。中间影院则是一个戴眼镜、二十岁左右的文艺少女。商业影院在骆驼心里有点像大街上随处可见的大叔，不过像英皇、耀莱这些影院沾染了她的记忆色彩，或许就是更亲切的大叔。", "影院，一个个配置着放映机的小小黑屋子，是城市中最常见的文化场域。无论是商业影院还是艺术影院，一群不同年龄、不同身份的人安静地聚在一起专注地度过两个小时的时光，或许是这座忙碌的城市里少有的乌托邦似的风景。", "作为公共空间的影院", "电影从诞生之初就是一项公共艺术。当1895年卢米埃尔兄弟第一次利用放映机公开放映电影并进行售票时，那些入场的观众就该意识到他们正见证着一项伟大艺术的诞生，且这项艺术绝对离不开公共性。电影院是电影公共性最好的承载体，无论是《天堂电影院》里那种老式的电影厅，还是上世纪中国常见的、接地气的电影放映方式“坝坝电影”。电影往往代表着一个时代的文化与精神，而电影院的兴衰也常常标志着这个时代城市居民群体的文化教育水平。", "艺术影院为骆驼提供了一种归属感，在那里，她和一群热爱电影的人聚在一起，她感到自己并不孤单。看电影是一件很费时间的事情，因此骆驼很少有额外的时间去社交，电影院成为了她交朋友的主要场所。电影院里，骆驼一旦认识了一个朋友，他就会带着你再去认识另一个……这样一个接一个地，她在看电影、换票的过程中认识了很多志同道合的朋友。", "电影看得多了，片子换了一场又一场、影院换了一个又一个，骆驼却总是能遇到一些熟悉的面孔——在影院，大家彼此之间都是“熟悉的陌生人”。他们彼此之间似乎存在着某种微妙的默契。即使没有真正地打招呼、正式地认识，当骆驼在每次匆匆忙忙赶到影院而用余光瞥见了那些熟悉的面孔时，她总会觉得很安心。有时她会想，“她/他也来看这部电影呀”；有时她会好奇，“她/他会不会也在想‘她又来赶场’了？”这时，如果他们通过某个契机，例如转票或者其中一个人主动搭讪，那么他们就很容易成为朋友。“更何况我们的爱好那么相似，只要去电影院去的足够多，哪怕是再内向的人也会交到朋友。”骆驼说。", "除了其他影迷，影院的工作人员也算骆驼的朋友。像是电影资料馆的工作人员都不穿制服，好像是自己本就相识的大爷大婶一样，让骆驼感觉特别亲切。中间影院的工作人员尤其用心，他们和影迷们一样真诚而尊重地迎接每一场电影，一起满心欢喜地共赴每一次光影盛事。如果某段时间骆驼去影院去的少了，那么等她下次去的时候总会收到影院大爷大婶们的关心。她和他们不仅仅是消费者和服务业的关系了，他们就是朋友。", "骆驼和她一位很重要的好朋友就是在北影节上认识的，那是骆驼那年北影节的第一场电影。那天她特别兴奋，早早就起了床，结果去得太早，电影院还没开门。等待电影院开门的时候，骆驼依稀听见旁边两个人在讨论收票的事情，正好是一场骆驼特别想看的电影。骆驼本来不是特别善于社交的人，但是她实在是太想要那张票了——她主动上去询问，结果得知原来他们也是想要收那张票。然后他们就开始聊自己喜欢的电影，聊这次北影节又要看什么电影……虽然票没收着，但骆驼就这样收获了两个朋友。他们白天各自过着自己的生活，晚上就聚在一块儿看电影、聊电影，那是骆驼很幸福的一段时光。现在，他们还会彼此互相寄生日礼物。", "有一年骆驼去上海参加上影节，和上影节的影迷们一起聚会，结果发现只有一个上海人。“全是我们刚在北京聚过的那一群人，有三个是从北京过去的，两个是从广州和深圳过去的。其实我们这几个刚在北京聚完，又跑到上海去聚了，”骆驼自己也觉得有点好笑，“那是我第一次参加上影节，我以为会有很多新朋友呢。”", "虽然通过电影交了如此多的朋友，骆驼却更像是一个电影“圈外人”。不是因为骆驼不够爱电影，而是她也不大喜欢影迷抱团这件事情。“抱团”是一个在迷群或粉圈中很常见的事情，当爱好成为了连接群体的情绪媒介继而为其中的个体提供身份认同，那么一些排他性、控制欲就会开始在这个团体中滋生。将自己忠实地放置进一个团体并通过捍卫这个团体来加固这一忠诚，是在文化迷群中十分舒服却偷懒的做法。某种程度上骆驼觉得影迷比饭圈更“难伺候”，一个影迷往往对自己的爱好足够痴迷、有自己的审美和底线，也往往颇有自我和想法。但是当影迷们抱团之后，团体内的人就会不讲理的排除团体以外的一切。当一件有争议的事情发生，他们甚至会罔顾事实而进行一些无意义的批判，甚至想要影响甚至掌控舆论——骆驼不喜欢这种感觉。在电影上，骆驼始终忠于她自己。", "尾声：城市绿洲与海市蜃楼", "近年来，有关“电影已死”的言论十分喧嚣，人们担心电影正随着时代发展而渐渐式微，最终成为博物馆里才有的怀旧媒介。如同影迷骆驼不愿也无法成为影迷团体中的一员；电影作为一种城市工业与文化文明的结晶，却呈现出与现代城市社会越来越快的节奏的对抗。不受时间空间限制而给观众提供轻松愉悦的其他媒体例如电视剧、短视频分散着许多人的精力与时间，侵蚀着电影的存在。如果说电影是大众文化的绿洲，那这艺术的真空，就仿佛美丽又危险的海市蜃楼，给电影工业一个繁荣却虚空的想象。", "骆驼几乎不刷短视频，短视频在她看来比电影还要花时间。除了电影，她还喜欢书本、植物和戏剧。戏剧和电影在她心中几乎有着同样的重量，如果说电影是旁观生命，戏剧就是在与生命交流，她觉得自己都没法舍弃。骆驼喜欢剧场，也喜欢影院，或许它们从本质上都是一样的吧。", "电影已经融入了骆驼的生命，成为她的一部分。但她并不纠结于从电影中要索取什么，仅仅是还能在影院享受一部又一部的电影，骆驼已经觉得很幸福了。", "骆驼在家里种了很多花花草草。她很兴奋地跟我们介绍：“我种了绣球，还种了银杏。你知道银杏吗？我就是捡了一个种子，把它种下去了，现在就已经有挺高了。我不知道他会不会结果，因为他就算结果，我想也不会是这一两年的事情。”只要还有这样一群影迷存在，电影或许就不会死亡。"], "excerpt": "电影看得多了，片子换了一场又一场、影院换了一个又一个，骆驼却总是能遇到一些熟悉的面孔——在影院，大家彼此之间都是“熟悉的陌生人”。他们彼此之间似乎存在着某种微妙的默契。即使没有真正地打招呼、正式地认识，当骆驼在每次匆匆忙忙赶到影院而用余光瞥见了那些熟悉的面孔时，她总会觉得很安心。有时她会想，“她/他也来看这部电影呀”；有时她会好奇，“她/他会不会也在想‘她又来赶场’了？”这时，如果他们通过某个契机，例如转票或者其中一个人主动搭讪，那么他们就很容易成为朋友。“更何况我们的爱好那么相似，只要去电影院去的足够多，哪怕是再内向的人也会交到朋友。”骆驼说。", "by": "李晴晴 · 罗方妤 · 谢冰妍", "primary": false, "note": ""}, {"id": "autumn", "title": "秋天扑面而来", "cat": "短诗", "keys": ["秋日", "瞬间", "感官"], "theme": "autumn", "text": ["影子在脚下滚动", "叶子撞进我怀里", "在这样的天气出门", "秋天扑面而来"], "excerpt": "影子在脚下滚动\n叶子撞进我怀里\n在这样的天气出门\n秋天扑面而来", "by": "谢冰妍", "primary": false, "note": ""}, {"id": "persimmon", "title": "柿子", "cat": "短诗", "keys": ["校园", "荒诞", "死亡"], "theme": "fruit", "text": ["如果有来生", "就要做30楼门口最高的那棵", "柿子树上的柿子", "不会因为枝桠低矮", "而在某个黑夜被杆子打了", "闷进布口袋拿了去", "卷王还是教授", "路过都要忍不住仰望称赞我", "叶子落了，长势良好", "于是 在某个冬天的日子", "成熟得汁水丰富", "迎来我灿烂而悲伤的死亡——", "我掉下来，", "随机砸在一个北大学子", "或者宿舍门口腻腻歪歪情侣", "的头上"], "excerpt": "于是 在某个冬天的日子\n成熟得汁水丰富\n迎来我灿烂而悲伤的死亡——\n我掉下来，\n随机砸在一个北大学子\n或者宿舍门口腻腻歪歪情侣\n的头上", "by": "谢冰妍", "primary": false, "note": ""}];

return '<div class="visual">'+start+s+end+'</div>'}

function safeHistory(kind,state,url){try{history[kind==='push'?'pushState':'replaceState'](state,'',url)}catch{}}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function theme(t){if(t)document.body.dataset.theme=t;else delete document.body.dataset.theme;music.setTheme(t||'silk')}
function renderTab(cat){const switched=currentTab!==cat;currentTab=cat;document.querySelectorAll('[role=tab]').forEach(b=>{const active=b.dataset.cat===cat;b.classList.toggle('active',active);b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1});const list=works.filter(w=>w.cat===cat).sort((a,b)=>Number(b.primary)-Number(a.primary));document.querySelector('#tabstatus').innerHTML='<strong>'+esc(labels[cat]||cat)+'</strong><span>'+list.length+' 篇作品'+(list.some(w=>w.primary)?' · 代表作排在首篇':'')+'</span>';if(switched){document.querySelector('#tabstatus').classList.remove('status-arrive');void document.querySelector('#tabstatus').offsetWidth;document.querySelector('#tabstatus').classList.add('status-arrive');}document.querySelector('#cards').setAttribute('aria-labelledby','tab-'+cats.indexOf(cat));document.querySelector('#cards').innerHTML=list.map(w=>`<article class="card ${w.cat==='短诗'?'poemcard':''}"><div class="thumb" data-work="${w.id}" style="view-transition-name:art-${w.id}" role="button" tabindex="0" aria-label="阅读全文：${esc(w.title)}" onclick="openWork('${w.id}')" onkeydown="if(event.key==='Enter')openWork('${w.id}')">${svg(w.theme)}</div><div class="tags">${tags(w)}${w.primary?'<span class="tag">代表作</span>':''}</div><h3>${esc(w.title)}</h3><div class="credit">${esc(w.by)}${w.cat==='故事'?' · 独立创作':''}</div><p class="excerpt">${esc(w.excerpt)}</p><button class="read" data-work="${w.id}" onclick="openWork('${w.id}')">${w.cat==='短诗'?'读这首诗':'展开全文'} ↗</button></article>`).join('')}
function goLibraryNow(cat){if(currentId){currentId=null;document.querySelector('#reader').classList.remove('active');document.querySelector('#landing').hidden=false;theme(null)}renderTab(cat);toast('已进入'+(labels[cat]||cat)+'作品区');document.querySelector('#library').scrollIntoView({behavior:'smooth'});safeHistory('replace',null,location.pathname+location.search+'#category='+encodeURIComponent(cat))}
function goHomeNow(){currentId=null;document.querySelector('#reader').classList.remove('active');document.querySelector('#landing').hidden=false;theme(null);safeHistory('replace',null,location.pathname+location.search);window.scrollTo({top:0,behavior:'smooth'});updateProgress()}
function goAbout(){goHome();setTimeout(()=>document.querySelector('#about').scrollIntoView({behavior:'smooth'}),80)}
function openWorkNow(id,restore=false){const w=works.find(w=>w.id===id);if(!w)return;if(!currentId)homeScroll=window.scrollY;currentId=id;theme(w.theme);const list=works.filter(x=>x.cat===w.cat),i=list.indexOf(w),prev=list[i-1],next=list[i+1];document.querySelector('#reader').innerHTML=`<div class="backrow"><button class="link" onclick="backToLibrary()">← 返回${labels[w.cat]||w.cat}作品</button><span>${w.text.join('').length.toLocaleString()} 字 · ${w.cat==='故事'?'个人原创':'文字作品'}</span></div><section class="readhero fade"><div class="cover" style="view-transition-name:art-${w.id}">${svg(w.theme)}</div><div><div class="eyebrow">${labels[w.cat]||w.cat} / ${String(works.indexOf(w)+1).padStart(2,'0')}</div><h1>${esc(w.title)}</h1><div class="by">${esc(w.by)}${w.cat==='故事'?' · 个人原创':''}</div><div class="tags">${tags(w)}</div></div></section><article class="readerbody ${w.cat==='短诗'?'poetry':''} fade">${w.text.map(t=>`<p${/^\[\d+\]|^【参考|^\[1\]|^\[2\]/.test(t)?' class="reference"':(/^(一、|二、|三、|一 |二 |三 |骆驼的迁徙|骆驼和她的绿洲|作为公共空间|尾声)/.test(t)||t==='女性主义的现代性危机')?' class="sectiontitle"':''}>${esc(t)}</p>`).join('')}<div class="endmark">· · ·</div>${w.note?`<p class="sourcenote">${esc(w.note)}</p>`:''}<div class="readnav"><button ${prev?`onclick="openWork('${prev.id}')"`:'disabled'}><small>← 上一篇</small><strong>${prev?esc(prev.title):'这一类的第一篇'}</strong></button><button ${next?`onclick="openWork('${next.id}')"`:'onclick="backToLibrary()"'}><small>${next?'下一篇 →':'返回分类 →'}</small><strong>${next?esc(next.title):'还有更多文字'}</strong></button></div></article>`;document.querySelector('#landing').hidden=true;document.querySelector('#reader').classList.add('active');if(!restore)safeHistory('push',{id},location.pathname+location.search+'#work='+id);window.scrollTo({top:0,behavior:'instant'});updateProgress()}
function backToLibraryNow(){const w=works.find(w=>w.id===currentId);currentTab=w?w.cat:currentTab;currentId=null;document.querySelector('#reader').classList.remove('active');document.querySelector('#landing').hidden=false;theme(null);renderTab(currentTab);safeHistory('replace',null,location.pathname+location.search+'#category='+encodeURIComponent(currentTab));window.scrollTo({top:homeScroll,behavior:'instant'});updateProgress()}
let activeTransition=null,sceneBusy=false;
function sceneChange(change){if(sceneBusy||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){change();return}if(activeTransition)activeTransition.skipTransition();if(document.startViewTransition){sceneBusy=true;try{activeTransition=document.startViewTransition(()=>{change();sceneBusy=false});activeTransition.finished.catch(()=>{}).finally(()=>{activeTransition=null;sceneBusy=false})}catch{sceneBusy=false;change()}}else{change();const el=document.querySelector(currentId?'#reader':'#landing');el.classList.remove('scene-arrive');void el.offsetWidth;el.classList.add('scene-arrive')}}
function openWork(id,restore=false){if(restore)openWorkNow(id,true);else sceneChange(()=>openWorkNow(id,false))}
function backToLibrary(){sceneChange(backToLibraryNow)}
function goLibrary(cat){sceneChange(()=>goLibraryNow(cat))}
function goHome(){sceneChange(goHomeNow)}
function updateProgress(){const d=document.documentElement,range=d.scrollHeight-innerHeight;document.querySelector('#progress').style.width=currentId&&range>0?Math.min(100,scrollY/range*100)+'%':'0%'}window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);
const music={ctx:null,on:false,master:null,effects:null,layer:null,timer:null,nodes:[],theme:'silk',step:0,
setup(){if(this.ctx)return;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('不支持音频');this.ctx=new Audio();this.master=this.ctx.createGain();this.master.gain.value=0;const filter=this.ctx.createBiquadFilter();filter.type='highpass';filter.frequency.value=220;this.master.connect(filter);filter.connect(this.ctx.destination);this.effects=this.ctx.createGain();this.effects.gain.value=.18;this.effects.connect(this.ctx.destination)},
async toggle(){this.setup();await this.ctx.resume();this.on=!this.on;this.master.gain.cancelScheduledValues(this.ctx.currentTime);this.master.gain.setTargetAtTime(this.on?.25:0,this.ctx.currentTime,.18);if(this.on)this.build();else{clearInterval(this.timer);this.timer=null;this.retire()}},
setTheme(t){if(this.theme===t)return;this.theme=t;if(this.on)this.build()},
profile(){return {sea:{root:293.66,notes:[0,3,7,10,12],pattern:[0,2,1,3,null,2,4,1,0,null,2,1,3,2,null,0],beat:1.45},river:{root:293.66,notes:[0,2,5,7,10],pattern:[0,3,1,2,null,1,4,3,2,null,0,1,3,null,2,0],beat:1.55},mist:{root:329.63,notes:[0,2,4,7,9],pattern:[0,2,1,3,null,4,2,1,0,3,null,2,1,4,null,0],beat:1.35},rain:{root:277.18,notes:[0,3,5,7,10],pattern:[2,0,1,null,3,2,0,null,1,4,3,2,null,1,0,null],beat:1.4},room:{root:293.66,notes:[0,3,5,7,10],pattern:[0,null,2,1,null,3,2,null,4,1,null,0,2,null,1,0],beat:1.65},warm:{root:329.63,notes:[0,2,4,7,9],pattern:[0,2,3,1,4,2,null,0,1,3,2,4,null,1,2,0],beat:1.2},silk:{root:349.23,notes:[0,2,4,7,9],pattern:[0,1,2,null,3,2,1,4,null,2,0,1,3,null,2,0],beat:1.35},pink:{root:392,notes:[0,2,4,7,9],pattern:[0,2,4,3,1,null,2,3,4,2,null,1,3,2,1,0],beat:1.15},cinema:{root:293.66,notes:[0,2,5,7,9],pattern:[0,3,2,1,null,4,3,2,0,null,1,2,3,1,null,0],beat:1.4},autumn:{root:349.23,notes:[0,2,4,7,9],pattern:[0,2,1,3,null,4,2,0,1,null,2,3,1,2,null,0],beat:1.3},fruit:{root:392,notes:[0,2,4,7,9],pattern:[0,3,2,4,1,null,3,0,2,1,null,4,3,2,1,0],beat:1.2}}[this.theme]},
retire(){if(!this.layer)return;const old=this.layer,nodes=this.nodes.slice();old.gain.setTargetAtTime(0,this.ctx.currentTime,.18);setTimeout(()=>{nodes.forEach(n=>{try{n.stop();n.disconnect()}catch{}});old.disconnect()},1200);this.layer=null;this.nodes=[]},
build(){clearInterval(this.timer);this.retire();const c=this.ctx;this.layer=c.createGain();this.layer.gain.value=0;this.layer.connect(this.master);this.layer.gain.setTargetAtTime(1,c.currentTime,.3);this.step=0;this.note();this.timer=setInterval(()=>this.note(),this.profile().beat*1000)},
tone(freq,t,duration,bus,volume=.16,track=false){const c=this.ctx;[1,2,3].forEach((harmonic,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq*harmonic;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume*[1,.12,.025][i],t+.022);g.gain.exponentialRampToValueAtTime(.0001,t+duration/(i+1));o.connect(g);g.connect(bus);o.start(t);o.stop(t+duration+.05);if(track)this.nodes.push(o);o.onended=()=>{o.disconnect();g.disconnect();if(track)this.nodes=this.nodes.filter(n=>n!==o)}})},
note(){if(!this.on||!this.layer||document.hidden)return;const p=this.profile(),index=p.pattern[this.step%p.pattern.length],t=this.ctx.currentTime;this.step++;if(index===null)return;const f=p.root*Math.pow(2,p.notes[index]/12);this.tone(f,t,2.65,this.layer,.12,true);if(this.step%4===1)this.tone(p.root*Math.pow(2,p.notes[2]/12),t+.18,2.1,this.layer,.035,true)},
async click(target){try{this.setup();await this.ctx.resume();const id=target.closest?.('[data-work]')?.dataset.work;const w=works.find(x=>x.id===id);const mood=w?.theme||this.theme;const f={sea:440,river:392,rain:466.16,room:415.3,pink:659.25,warm:523.25}[mood]||587.33;this.tone(f,this.ctx.currentTime,.18,this.effects,.12,false);if(id)this.tone(f*1.25,this.ctx.currentTime+.055,.22,this.effects,.055,false)}catch{}},
};
async function toggleSound(){try{await music.toggle();const b=document.querySelector('#sound');b.classList.toggle('on',music.on);b.setAttribute('aria-pressed',String(music.on));b.setAttribute('aria-label',music.on?'点击关闭 BGM；按钮音效保持开启':'点击播放 BGM；按钮音效独立播放');document.querySelector('#soundLabel').textContent=music.on?'BGM · 点击关闭':'BGM · 点击播放';toast(music.on?'BGM 已开启，轻声陪你阅读':'BGM 已关闭，按钮音效仍保留')}catch{toast('当前浏览环境不支持音频，请在浏览器中打开')}}
document.addEventListener('click',e=>{const target=e.target.closest?.('button,[role="button"]');if(target)music.click(target)},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('[role="button"]'))music.click(e.target)},true);
document.addEventListener('visibilitychange',()=>{if(music.ctx){if(document.hidden)music.ctx.suspend();else music.ctx.resume()}});
document.querySelector('#heroArt').innerHTML=svg('sea');const recOrder=['fish','home','barbie','news'];document.querySelector('#recommend').innerHTML=recOrder.map((id,i)=>{const w=works.find(w=>w.id===id);return `<button class="rec" onclick="goLibrary('${w.cat}')"><span class="label"><span class="index">0${i+1}</span>${labels[w.cat]||w.cat}${w.cat==='故事'?' · 个人原创':''}</span><h3>${esc(w.title)}</h3><p>${esc(w.excerpt)}</p><span class="go">前往${labels[w.cat]||w.cat}作品区 ↓</span></button>`}).join('');document.querySelector('#tabs').innerHTML=cats.map((cat,i)=>`<button role="tab" id="tab-${i}" aria-controls="cards" data-cat="${cat}" onclick="renderTab('${cat}');">${labels[cat]||cat}</button>`).join('');document.querySelector('#tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();let i=cats.indexOf(currentTab);i=e.key==='Home'?0:e.key==='End'?cats.length-1:(i+(e.key==='ArrowRight'?1:-1)+cats.length)%cats.length;renderTab(cats[i]);document.querySelector('#tab-'+i).focus()});renderTab(currentTab);
function restoreRoute(){const h=location.hash.slice(1);if(h.startsWith('work=')){openWork(h.slice(5),true)}else{const cat=h.startsWith('category=')?decodeURIComponent(h.slice(9)):currentTab;currentId=null;document.querySelector('#landing').hidden=false;document.querySelector('#reader').classList.remove('active');theme(null);renderTab(cats.includes(cat)?cat:'故事');if(h.startsWith('category='))document.querySelector('#library').scrollIntoView()}}window.addEventListener('popstate',restoreRoute);restoreRoute();
</script></body></html>
